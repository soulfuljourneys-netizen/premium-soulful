name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main    # change if your main branch is named differently

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # If your build output dir is "dist" (Vite) leave as-is.
      # If it's "build" (CRA), change local-dir to ./build below.
      - name: Deploy via SFTP/FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}        # 21 for FTP, 22 for SFTP
          local-dir: ./dist                   # change to ./build if needed
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          protocol: sftp                      # use "ftp" or "sftp" as required
          dangerous-clean-slate: true
